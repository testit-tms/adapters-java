name: e2e tests
run-name: "#${{ github.run_number }} test by ${{ github.triggering_actor }}"
on:
  pull_request:
    paths:
      - "testit-adapter-cucumber4/**"
      - "testit-adapter-cucumber5/**"
      - "testit-adapter-cucumber6/**"
      - "testit-adapter-cucumber7/**"
      - "testit-adapter-cucumber8/**"
      - "testit-adapter-jbehave/**"
      - "testit-adapter-junit4/**"
      - "testit-adapter-junit5/**"
      - "testit-adapter-junit6/**"
      - "testit-adapter-selenide/**"
      - "testit-adapter-testng/**"
      - "testit-java-commons/**"
      - "build.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/**/test.yml"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Запустить тесты"
        required: true
        type: boolean
        default: true
env:
  DOTNET_VERSION: 8
  GITHUB_PAT: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
  JAVA_DISTRIBUTION: "temurin"
  JAVA_TOOL_OPTIONS: "-Dorg.slf4j.simpleLogger.defaultLogLevel=info"
  # Pin patch: Temurin 8.0.514 downloads were corrupt / checksum-mismatched on GH runners.
  JAVA_VERSION: "8.0.512"
  PYTHON_VERSION: 3.12
  TEMP_FILE: tmp/output.txt
  FILTER_FILE: tmp/filter.txt
  TMS_ADAPTER_MODE: 1
  TMS_CERT_VALIDATION: false
  TMS_PRIVATE_TOKEN: ${{ secrets.TESTIT_PRIVATE_TOKEN }}
  TMS_URL: ${{ secrets.TESTIT_URL }}
  TMS_IMPORT_REALTIME: false
jobs:
  # should control launch of everything else depending on this step
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check run-e2e label or workflow_dispatch
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  test-gradle:
    needs: check-label
    if: needs.check-label.outputs.should_run == 'true'
    name: ${{ matrix.project_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_name: gradle-junit4
            configuration_id: GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: GRADLE_JUNIT4_PROJECT_ID
          - project_name: gradle-junit5
            configuration_id: GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: GRADLE_JUNIT5_PROJECT_ID
          - project_name: gradle-junit6
            configuration_id: GRADLE_JUNIT6_CONFIGURATION_ID
            project_id: GRADLE_JUNIT6_PROJECT_ID
            java_version: 17
          - project_name: gradle-testng
            configuration_id: GRADLE_TESTNG_CONFIGURATION_ID
            project_id: GRADLE_TESTNG_PROJECT_ID

          - project_name: jbehave-gradle-junit5
            configuration_id: JBEHAVE_GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: JBEHAVE_GRADLE_JUNIT5_PROJECT_ID
          - project_name: jbehave-gradle-junit4
            configuration_id: JBEHAVE_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: JBEHAVE_GRADLE_JUNIT4_PROJECT_ID
          - project_name: jbehave-gradle-testng
            configuration_id: JBEHAVE_GRADLE_TESTNG_CONFIGURATION_ID
            project_id: JBEHAVE_GRADLE_TESTNG_PROJECT_ID

          - project_name: cucumber7-gradle-testng
            configuration_id: CUCUMBER7_GRADLE_TESTNG_CONFIGURATION_ID
            project_id: CUCUMBER7_GRADLE_TESTNG_PROJECT_ID
          - project_name: cucumber7-gradle-junit4
            configuration_id: CUCUMBER7_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: CUCUMBER7_GRADLE_JUNIT4_PROJECT_ID
          - project_name: cucumber7-gradle-junit5
            configuration_id: CUCUMBER7_GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: CUCUMBER7_GRADLE_JUNIT5_PROJECT_ID

          - project_name: cucumber8-gradle-testng
            configuration_id: CUCUMBER8_GRADLE_TESTNG_CONFIGURATION_ID
            project_id: CUCUMBER8_GRADLE_TESTNG_PROJECT_ID
            java_version: 17
          - project_name: cucumber8-gradle-junit4
            configuration_id: CUCUMBER8_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: CUCUMBER8_GRADLE_JUNIT4_PROJECT_ID
            java_version: 17
          - project_name: cucumber8-gradle-junit5
            configuration_id: CUCUMBER8_GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: CUCUMBER8_GRADLE_JUNIT5_PROJECT_ID
            java_version: 17

          - project_name: cucumber6-gradle-junit5
            configuration_id: CUCUMBER6_GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: CUCUMBER6_GRADLE_JUNIT5_PROJECT_ID
          - project_name: cucumber6-gradle-junit4
            configuration_id: CUCUMBER6_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: CUCUMBER6_GRADLE_JUNIT4_PROJECT_ID
          - project_name: cucumber6-gradle-testng
            configuration_id: CUCUMBER6_GRADLE_TESTNG_CONFIGURATION_ID
            project_id: CUCUMBER6_GRADLE_TESTNG_PROJECT_ID

          - project_name: cucumber5-gradle-junit4
            configuration_id: CUCUMBER5_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: CUCUMBER5_GRADLE_JUNIT4_PROJECT_ID
          - project_name: cucumber5-gradle-junit5
            configuration_id: CUCUMBER5_GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: CUCUMBER5_GRADLE_JUNIT5_PROJECT_ID
          - project_name: cucumber5-gradle-testng
            configuration_id: CUCUMBER5_GRADLE_TESTNG_CONFIGURATION_ID
            project_id: CUCUMBER5_GRADLE_TESTNG_PROJECT_ID

          - project_name: cucumber4-gradle-junit4
            configuration_id: CUCUMBER4_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: CUCUMBER4_GRADLE_JUNIT4_PROJECT_ID
          - project_name: cucumber4-gradle-testng
            configuration_id: CUCUMBER4_GRADLE_TESTNG_CONFIGURATION_ID
            project_id: CUCUMBER4_GRADLE_TESTNG_PROJECT_ID

          - project_name: selenide-gradle-junit5
            configuration_id: SELENIDE_GRADLE_JUNIT5_CONFIGURATION_ID
            project_id: SELENIDE_GRADLE_JUNIT5_PROJECT_ID
          - project_name: serenity2-gradle-junit4
            configuration_id: SERENITY2_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: SERENITY2_GRADLE_JUNIT4_PROJECT_ID
          - project_name: serenity3-gradle-junit4
            configuration_id: SERENITY3_GRADLE_JUNIT4_CONFIGURATION_ID
            project_id: SERENITY3_GRADLE_JUNIT4_PROJECT_ID
    env:
      TMS_CONFIGURATION_ID: ${{ secrets[matrix.configuration_id] }}
      TMS_PROJECT_ID: ${{ secrets[matrix.project_id] }}
      TMS_TEST_RUN_NAME: ${{ matrix.project_name }} TestRun
      SUBSET_IDS_FILE: api-validator-dotnet/ci/mode0/${{ matrix.project_name }}/external-ids.txt
    steps:
      - name: Checkout adapters-java
        uses: actions/checkout@v4
      - name: Checkout api-validator-dotnet
        uses: actions/checkout@v4
        with:
          repository: testit-tms/api-validator-dotnet
          ref: main
          token: ${{ env.GITHUB_PAT }}
          ref: feat/TMS-38946   # temporary; drop after merge to main
          path: api-validator-dotnet
      - name: Checkout testit-cli
        uses: actions/checkout@v4
        with:
          repository: testit-tms/testit-cli
          token: ${{ env.GITHUB_PAT }}
          ref: fix/autotests-filter-project-scope   # temporary; drop after merge/PyPI
          path: testit-cli
      - name: Checkout java-examples
        uses: actions/checkout@v4
        with:
          repository: testit-tms/java-examples
          ref: main
          path: java-examples
      - name: Show validator/examples SHAs
        run: |
          echo "api-validator: $(git -C api-validator-dotnet rev-parse HEAD) $(git -C api-validator-dotnet log -1 --format=%s)"
          echo "java-examples: $(git -C java-examples rev-parse HEAD) $(git -C java-examples log -1 --format=%s)"
          grep -E '"name"|"externalId"' api-validator-dotnet/TestIT.ApiResponseValidator/Expected/serenity3-gradle-junit4/CheckAutoTests.json | head -20
          sed -n '1,12p' java-examples/serenity3-gradle-junit4/src/test/resources/features/parameterized.feature
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-package: jdk
          java-version: ${{ matrix.java_version || env.JAVA_VERSION }}
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup environment
        run: |
          ./gradlew --no-daemon -DdisableSign=true publishToMavenLocal
          dotnet build --configuration Debug --property WarningLevel=0 api-validator-dotnet
          pip install ./testit-cli
          

      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
      - name: Test
        run: |
          export SYNC_STORAGE_VERSION=$(grep -o 'SYNC_STORAGE_VERSION = "[^"]*"' testit-java-commons/src/main/java/ru/testit/syncstorage/SyncStorageRunner.java | cut -d'"' -f2)
          # current location - /adapters-java/
          
          cd java-examples/${{ matrix.project_name }}

          mkdir -p .caches
          wget -O .caches/syncstorage-linux-amd64 \
          "https://github.com/testit-tms/sync-storage-public/releases/download/${SYNC_STORAGE_VERSION}/syncstorage-${SYNC_STORAGE_VERSION}-linux_amd64"
          chmod +x .caches/syncstorage-linux-amd64
          nohup .caches/syncstorage-linux-amd64 --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 & 
          
          sleep 1
          
          curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null \
            && echo "sync-storage health: ok" \
            || echo "sync-storage health: not ready yet"

          chmod +x ./gradlew
          ./gradlew test --no-daemon -DtmsUrl=${{ env.TMS_URL }} -DtmsPrivateToken=${{ env.TMS_PRIVATE_TOKEN }} \
          -DtmsProjectId=${{ env.TMS_PROJECT_ID }} -DtmsConfigurationId=${{ env.TMS_CONFIGURATION_ID }} \
          -DtmsAdapterMode=${{ env.TMS_ADAPTER_MODE }} -DtmsTestRunId=${{ env.TMS_TEST_RUN_ID }} \
          -DtmsCertValidation=${{ env.TMS_CERT_VALIDATION }} || true # ignore error code

          sleep 1

          # SS may already exit after Work X ("no active workers") — Connection refused is success, not a failure.
          if curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null; then
            curl -sf --max-time 300 \
              "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" \
              && echo "wait-completion: ok" \
              || echo "wait-completion: sync-storage closed during wait"
          else
            if grep -q "Work X completed successfully" service.log 2>/dev/null; then
              echo "sync-storage already stopped — Work X marker found in service.log"
            else
              echo "WARNING: sync-storage stopped without Work X success marker"
            fi
          fi
          
          cat service.log
          # cat /home/runner/work/adapters-java/adapters-java/java-examples/gradle-junit5/build/.caches/shutdown.log
      - name: Validate
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet


      - name: Create TestRun
        run: |
          testit testrun create --token ${{ env.TMS_PRIVATE_TOKEN }} --output ${{ env.TEMP_FILE }}
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test importRealtime=true
        run: |
          export TMS_IMPORT_REALTIME=true
          cd java-examples/${{ matrix.project_name }}

          SYNC_STORAGE_BIN=".caches/syncstorage-linux-amd64"
          pkill -f "syncstorage.*--port 49152" || true
          pkill -f "syncstorage-linux-amd64" || true
          sleep 1

          nohup "$SYNC_STORAGE_BIN" --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 & 
          
          sleep 1
          
          curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null \
            && echo "sync-storage health: ok" \
            || echo "sync-storage health: not ready yet"

          chmod +x ./gradlew
          ./gradlew test --no-daemon -DtmsUrl=${{ env.TMS_URL }} -DtmsPrivateToken=${{ env.TMS_PRIVATE_TOKEN }} \
          -DtmsProjectId=${{ env.TMS_PROJECT_ID }} -DtmsConfigurationId=${{ env.TMS_CONFIGURATION_ID }} \
          -DtmsAdapterMode=${{ env.TMS_ADAPTER_MODE }} -DtmsTestRunId=${{ env.TMS_TEST_RUN_ID }} \
          -DtmsCertValidation=${{ env.TMS_CERT_VALIDATION }} || true # ignore error code

          sleep 1

          if curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null; then
            curl -sf --max-time 300 \
              "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" \
              && echo "wait-completion: ok" \
              || echo "wait-completion: sync-storage closed during wait"
          else
            if grep -q "Work X completed successfully" service.log 2>/dev/null; then
              echo "sync-storage already stopped — Work X marker found in service.log"
            else
              echo "WARNING: sync-storage stopped without Work X success marker"
            fi
          fi
          
          cat service.log

      - name: Validate importRealtime=true
        run: |
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet


      - name: Test Adapter Mode 2
        run: |
          export TMS_ADAPTER_MODE=2
          cd java-examples/${{ matrix.project_name }}
          
          chmod +x ./gradlew
          ./gradlew test --no-daemon -DtmsUrl=${{ env.TMS_URL }} -DtmsPrivateToken=${{ env.TMS_PRIVATE_TOKEN }} \
          -DtmsProjectId=${{ env.TMS_PROJECT_ID }} -DtmsConfigurationId=${{ env.TMS_CONFIGURATION_ID }} \
          -DtmsAdapterMode=${{ env.TMS_ADAPTER_MODE }} \
          -DtmsCertValidation=${{ env.TMS_CERT_VALIDATION }} || true # ignore error code

          if curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null; then
            curl -sf --max-time 300 \
              "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" \
              && echo "wait-completion: ok" \
              || echo "wait-completion: sync-storage closed during wait"
          else
            if grep -q "Work X completed successfully" service.log 2>/dev/null; then
              echo "sync-storage already stopped — Work X marker found in service.log"
            else
              echo "WARNING: sync-storage stopped without Work X success marker"
            fi
          fi

      - name: Validate Again
        run: |
          export TMS_TEST_RUN_ID=skip
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      # --- Mode 0: full suite, adapter filters by filled test run ---
      - name: Create filled TestRun Mode 0
        run: |
          pip install ./testit-cli
          mkdir -p tmp
          testit testrun create launch \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --project-id "${{ env.TMS_PROJECT_ID }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --autotest-external-ids-file "${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}" \
            --testrun-name "${{ matrix.project_name }} Mode0" \
            --output "${{ env.TEMP_FILE }}"
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV

      - name: Test Adapter Mode 0
        run: |
          export TMS_ADAPTER_MODE=0
          cd java-examples/${{ matrix.project_name }}

          SYNC_STORAGE_BIN=".caches/syncstorage-linux-amd64"
          pkill -f "syncstorage.*--port 49152" || true
          pkill -f "syncstorage-linux-amd64" || true
          sleep 1

          nohup "$SYNC_STORAGE_BIN" --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 &

          sleep 1
          curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null \
            && echo "sync-storage health: ok" \
            || echo "sync-storage health: not ready yet"

          chmod +x ./gradlew
          # Full suite — adapter keeps only tests present in the filled run
          ./gradlew test --no-daemon -DtmsUrl=${{ env.TMS_URL }} -DtmsPrivateToken=${{ env.TMS_PRIVATE_TOKEN }} \
          -DtmsProjectId=${{ env.TMS_PROJECT_ID }} -DtmsConfigurationId=${{ env.TMS_CONFIGURATION_ID }} \
          -DtmsAdapterMode=0 -DtmsTestRunId=${{ env.TMS_TEST_RUN_ID }} \
          -DtmsCertValidation=${{ env.TMS_CERT_VALIDATION }} || true

          sleep 1
          if curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null; then
            curl -sf --max-time 300 \
              "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" \
              && echo "wait-completion: ok" \
              || echo "wait-completion: sync-storage closed during wait"
          else
            if grep -q "Work X completed successfully" service.log 2>/dev/null; then
              echo "sync-storage already stopped — Work X marker found in service.log"
            else
              echo "WARNING: sync-storage stopped without Work X success marker"
            fi
          fi
          cat service.log

      - name: Validate Mode 0
        run: |
          export TMS_EXPECTED_EXTERNAL_IDS_FILE="${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}"
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet

      # --- autotests_filter + mode 1 (skip jbehave — no FilterFactory) ---
      - name: Create filled TestRun Filter
        if: ${{ !startsWith(matrix.project_name, 'jbehave') }}
        run: |
          pip install ./testit-cli
          mkdir -p tmp
          PN="${{ matrix.project_name }}"
          case "$PN" in
            gradle-junit4) FF=gradle-junit4 ;;
            gradle-junit5) FF=gradle-junit5 ;;
            gradle-junit6) FF=gradle-junit6 ;;
            gradle-testng) FF=gradle-testng ;;
            selenide*) FF=gradle-junit5 ;;
            serenity*) FF=gradle-junit4 ;;
            cucumber*) FF=gradle-cucumber ;;
            *) echo "Unknown project for filter_framework: $PN" >&2; exit 1 ;;
          esac
          echo "FILTER_FRAMEWORK=$FF" >> $GITHUB_ENV
          testit testrun create launch \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --project-id "${{ env.TMS_PROJECT_ID }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --autotest-external-ids-file "${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}" \
            --testrun-name "${{ matrix.project_name }} Filter" \
            --output "${{ env.TEMP_FILE }}"
          echo "TMS_TEST_RUN_ID=$(<${{ env.TEMP_FILE }})" >> $GITHUB_ENV
          testit autotests_filter \
            --url "${{ env.TMS_URL }}" \
            --token "${{ env.TMS_PRIVATE_TOKEN }}" \
            --configuration-id "${{ env.TMS_CONFIGURATION_ID }}" \
            --testrun-id "$(<${{ env.TEMP_FILE }})" \
            --framework "$FF" \
            --output "${{ env.FILTER_FILE }}"
          echo "Filter file:" && cat "${{ env.FILTER_FILE }}"

      - name: Test with autotests_filter
        if: ${{ !startsWith(matrix.project_name, 'jbehave') }}
        run: |
          export TMS_ADAPTER_MODE=1
          cd java-examples/${{ matrix.project_name }}

          SYNC_STORAGE_BIN=".caches/syncstorage-linux-amd64"
          pkill -f "syncstorage.*--port 49152" || true
          pkill -f "syncstorage-linux-amd64" || true
          sleep 1

          nohup "$SYNC_STORAGE_BIN" --testRunId ${{ env.TMS_TEST_RUN_ID }} --port 49152 \
          --baseURL ${{ env.TMS_URL }} --privateToken ${{ env.TMS_PRIVATE_TOKEN }}  > service.log 2>&1 &

          sleep 1
          curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null \
            && echo "sync-storage health: ok" \
            || echo "sync-storage health: not ready yet"

          FILTER="$(cat ../../${{ env.FILTER_FILE }})"
          chmod +x ./gradlew
          if [[ "${{ env.FILTER_FRAMEWORK }}" == "gradle-cucumber" ]]; then
            ./gradlew test --no-daemon -DtmsUrl=${{ env.TMS_URL }} -DtmsPrivateToken=${{ env.TMS_PRIVATE_TOKEN }} \
            -DtmsProjectId=${{ env.TMS_PROJECT_ID }} -DtmsConfigurationId=${{ env.TMS_CONFIGURATION_ID }} \
            -DtmsAdapterMode=1 -DtmsTestRunId=${{ env.TMS_TEST_RUN_ID }} \
            -DtmsCertValidation=${{ env.TMS_CERT_VALIDATION }} \
            -Dcucumber.filter.name="$FILTER" || true
          else
            # FILTER contains --tests args from CLI
            ./gradlew test --no-daemon -DtmsUrl=${{ env.TMS_URL }} -DtmsPrivateToken=${{ env.TMS_PRIVATE_TOKEN }} \
            -DtmsProjectId=${{ env.TMS_PROJECT_ID }} -DtmsConfigurationId=${{ env.TMS_CONFIGURATION_ID }} \
            -DtmsAdapterMode=1 -DtmsTestRunId=${{ env.TMS_TEST_RUN_ID }} \
            -DtmsCertValidation=${{ env.TMS_CERT_VALIDATION }} \
            $FILTER || true
          fi

          sleep 1
          if curl -sf --connect-timeout 2 --max-time 3 http://127.0.0.1:49152/health >/dev/null; then
            curl -sf --max-time 300 \
              "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TMS_TEST_RUN_ID }}" \
              && echo "wait-completion: ok" \
              || echo "wait-completion: sync-storage closed during wait"
          else
            if grep -q "Work X completed successfully" service.log 2>/dev/null; then
              echo "sync-storage already stopped — Work X marker found in service.log"
            else
              echo "WARNING: sync-storage stopped without Work X success marker"
            fi
          fi
          cat service.log

      - name: Validate Filter
        if: ${{ !startsWith(matrix.project_name, 'jbehave') }}
        run: |
          export TMS_EXPECTED_EXTERNAL_IDS_FILE="${GITHUB_WORKSPACE}/${{ env.SUBSET_IDS_FILE }}"
          dotnet test --configuration Debug --no-build --logger:"console;verbosity=detailed" api-validator-dotnet
