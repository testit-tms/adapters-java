// Force java-examples (adapterVersion = "[0,)") to use the artifact just published to mavenLocal,
// not a newer release from Maven Central (e.g. 4.2.5 > 4.2.2-TMS-6.0).
def ver = System.getenv("ADAPTER_VERSION")
if (ver == null || ver.trim().isEmpty()) {
    throw new GradleException("ADAPTER_VERSION env is required for CI example runs")
}
ver = ver.trim()
gradle.beforeProject { project ->
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "ru.testit") {
                details.useVersion(ver)
                details.because("CI: pin ru.testit to mavenLocal publish (${ver})")
            }
        }
    }
}
